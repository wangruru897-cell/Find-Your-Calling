<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="基于八木仁平《如何找到想做的事》自我认知法。15 个问题，3 个支柱，1 句精确结论。" />
  <title>找到想做的事 · Find Your Calling</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --bg-alt: #f5f5f5;
      --ink: #0a0a0a;
      --ink-soft: #2a2a2a;
      --muted: #767676;
      --line: #e5e5e5;
      --line-strong: #0a0a0a;

      /* 3 module colors — primary, bold, distinct */
      --why: #E5322D;      /* red */
      --how: #0046C8;      /* blue */
      --what: #F4B400;     /* yellow */
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; overflow-x: hidden; }
    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      font-size: 15.5px;
    }
    .serif { font-family: 'Noto Serif SC', 'Songti SC', serif; }
    .en { font-family: 'Cormorant Garamond', 'Times New Roman', serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 32px 80px;
    }

    /* ========== 顶部 brand bar ========== */
    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 32px;
      border-bottom: 1.5px solid var(--ink);
      margin: 0 -32px 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
    }
    .brand-mark {
      width: 26px;
      height: 26px;
      display: flex;
      flex-shrink: 0;
    }
    .brand-text { display: flex; flex-direction: column; line-height: 1.1; }
    .brand-name {
      font-family: 'Noto Serif SC', serif;
      font-weight: 700;
      font-size: 15.5px;
      letter-spacing: 0.5px;
    }
    .brand-sub {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 11.5px;
      color: var(--muted);
      letter-spacing: 1.5px;
      margin-top: 2px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .mode-toggle {
      display: flex;
      gap: 0;
      align-items: stretch;
      border: 1px solid var(--ink);
    }
    .mode-toggle button {
      background: none;
      border: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--ink);
      cursor: pointer;
      padding: 8px 14px;
      transition: all 0.15s;
    }
    .mode-toggle button + button { border-left: 1px solid var(--ink); }
    .mode-toggle button.active {
      background: var(--ink);
      color: #fff;
    }

    /* ========== 欢迎页 Hero ========== */
    .welcome { animation: fadeIn 0.5s ease-out; }
    .hero {
      padding: 64px 0 0;
    }
    .hero-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--ink);
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .hero-eyebrow::before {
      content: '';
      width: 32px;
      height: 1.5px;
      background: var(--ink);
    }
    .hero h1 {
      font-family: 'Noto Serif SC', serif;
      font-weight: 900;
      font-size: 60px;
      line-height: 1.05;
      letter-spacing: -1.5px;
      margin: 0 0 24px;
    }
    .hero h1 .accent { color: var(--ink); }
    .hero h1 .italic-en {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 500;
      font-size: 30px;
      color: var(--muted);
      letter-spacing: 0;
      margin-top: 8px;
    }
    .hero .lede {
      font-size: 16px;
      line-height: 1.7;
      color: var(--ink-soft);
      max-width: 560px;
      margin: 0 0 24px;
    }
    .hero-stats {
      display: flex;
      gap: 28px;
      padding: 18px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      margin: 32px 0 0;
    }
    .hero-stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .hero-stat-num {
      font-family: 'Noto Serif SC', serif;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -0.5px;
    }
    .hero-stat-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      letter-spacing: 1.5px;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ========== Hero 大按钮（首页置顶 CTA） ========== */
    .hero-cta {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 36px auto 32px;
    }
    .btn-hero {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: var(--ink);
      color: #fff;
      border: none;
      padding: 24px 56px;
      font-family: 'Noto Serif SC', serif;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      min-width: 320px;
      position: relative;
    }
    .btn-hero:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(10,10,10,0.18);
    }
    .btn-hero:active { transform: translateY(0); }
    .btn-hero-arrow {
      font-size: 22px;
      font-weight: 400;
      transition: transform 0.2s ease;
    }
    .btn-hero:hover .btn-hero-arrow { transform: translateX(8px); }
    .hero-cta-meta {
      margin-top: 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 2.5px;
      color: var(--muted);
    }
    .hero-stats--compact {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 56px;
      max-width: 600px;
      padding: 22px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .hero-stats--compact .hero-stat {
      flex: 1;
      text-align: center;
      align-items: center;
    }
    .hero-stats--compact .hero-stat-num {
      font-family: 'Noto Serif SC', serif;
      font-weight: 700;
      font-size: 30px;
      letter-spacing: -0.5px;
    }
    .hero-stats--compact .hero-stat-sep {
      width: 1px;
      height: 32px;
      background: var(--line);
    }

    /* ========== 三色模块块（Hero 下方） ========== */
    .modules {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      margin: 48px 0 0;
      border: 1.5px solid var(--ink);
    }
    .module-block {
      padding: 28px 22px;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 140px;
      justify-content: space-between;
      border-right: 1.5px solid var(--ink);
    }
    .module-block:last-child { border-right: none; }
    .module-block.why { background: var(--why); }
    .module-block.how { background: var(--how); }
    .module-block.what { background: var(--what); color: var(--ink); }
    .mb-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      opacity: 0.75;
    }
    .mb-name {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 600;
      font-size: 32px;
      line-height: 1;
    }
    .mb-name-cn {
      font-family: 'Noto Serif SC', serif;
      font-weight: 700;
      font-size: 18px;
      margin-top: 4px;
    }

    /* ========== 公式区 ========== */
    .formula-section {
      margin: 80px 0 0;
      padding: 48px 0;
      border-top: 1.5px solid var(--ink);
    }
    .section-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      letter-spacing: 2.5px;
      color: var(--ink);
      text-transform: uppercase;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-num::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--ink);
    }
    .formula-equation {
      font-family: 'Noto Serif SC', serif;
      font-weight: 500;
      font-size: 26px;
      line-height: 1.6;
      margin: 0 0 16px;
      letter-spacing: -0.3px;
    }
    .formula-equation .op {
      font-weight: 700;
      font-size: 32px;
      vertical-align: -3px;
      margin: 0 4px;
    }
    .formula-equation .why-mark { color: var(--why); }
    .formula-equation .how-mark { color: var(--how); }
    .formula-equation .what-mark { color: var(--what); }
    .formula-equation .eq {
      color: var(--muted);
      margin: 0 10px;
    }
    .formula-equation .result {
      display: block;
      margin-top: 16px;
      font-weight: 900;
      font-size: 30px;
      letter-spacing: -0.5px;
    }
    .formula-note {
      font-size: 14px;
      color: var(--ink-soft);
      max-width: 540px;
      margin: 28px 0 0;
      line-height: 1.7;
      padding: 16px 20px;
      border-left: 3px solid var(--ink);
    }
    .formula-note strong { color: var(--ink); }

    /* ========== 步骤列表 ========== */
    .steps-section { margin: 64px 0 0; }
    .steps-list { list-style: none; padding: 0; margin: 28px 0 0; }
    .steps-list li {
      display: grid;
      grid-template-columns: 56px 12px 1fr;
      gap: 18px;
      padding: 24px 0;
      border-top: 1px solid var(--line);
      align-items: baseline;
    }
    .steps-list li:last-child { border-bottom: 1px solid var(--line); }
    .steps-num {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 600;
      font-size: 30px;
      color: var(--ink);
      line-height: 1;
    }
    .steps-dot {
      width: 8px;
      height: 8px;
      background: var(--ink);
      align-self: center;
    }
    .steps-dot.why { background: var(--why); }
    .steps-dot.how { background: var(--how); }
    .steps-dot.what { background: var(--what); }
    .steps-content h4 {
      font-family: 'Noto Serif SC', serif;
      font-weight: 700;
      font-size: 17px;
      margin: 0 0 4px;
    }
    .steps-content p {
      margin: 0;
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.6;
    }

    /* ========== 按钮 ========== */
    .start-cta { margin: 56px 0 0; }
    .btn-solid {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: var(--ink);
      color: #fff;
      border: none;
      font-family: 'Noto Sans SC', sans-serif;
      font-weight: 500;
      font-size: 15px;
      letter-spacing: 1px;
      padding: 18px 32px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-solid:hover { background: #2a2a2a; }
    .btn-solid .arrow { font-family: 'Cormorant Garamond', serif; font-size: 18px; }
    .btn-link {
      display: inline-block;
      background: none;
      border: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--ink);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 5px;
      text-decoration-thickness: 1px;
      padding: 8px 0;
    }
    .btn-link:hover { color: var(--ink-soft); }
    .btn-link[disabled] { opacity: 0.3; cursor: not-allowed; text-decoration: none; }

    /* ========== 误区页 ========== */
    .misconceptions-page { animation: fadeIn 0.5s ease-out; }
    .mis-header { margin: 56px 0 48px; }
    .mis-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--ink);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .mis-eyebrow::before {
      content: '';
      width: 32px;
      height: 1.5px;
      background: var(--ink);
    }
    .mis-title {
      font-family: 'Noto Serif SC', serif;
      font-weight: 900;
      font-size: 48px;
      line-height: 1.1;
      margin: 0 0 18px;
      letter-spacing: -1px;
    }
    .mis-title .italic-en {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 500;
      font-size: 24px;
      color: var(--muted);
      margin-top: 10px;
    }
    .mis-lede {
      font-size: 15.5px;
      color: var(--ink-soft);
      max-width: 560px;
      line-height: 1.75;
    }
    .mis-list { margin: 0 0 56px; }
    .mis-item {
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 24px;
      padding: 28px 0;
      border-top: 1px solid var(--line);
    }
    .mis-item:last-child { border-bottom: 1px solid var(--line); }
    .mis-num {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 600;
      font-size: 36px;
      color: var(--ink);
      line-height: 1;
    }
    .mis-body .mis-myth {
      font-family: 'Noto Serif SC', serif;
      font-weight: 700;
      font-size: 18px;
      margin: 0 0 10px;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .mis-body .mis-myth-mark {
      display: inline-block;
      width: 18px;
      height: 18px;
      background: var(--ink);
      color: #fff;
      text-align: center;
      line-height: 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
      position: relative;
      top: 2px;
    }
    .mis-body .mis-truth {
      font-size: 14.5px;
      color: var(--ink-soft);
      line-height: 1.8;
      margin: 0;
    }
    .mis-body .mis-clarify {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      letter-spacing: 1.5px;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 10px;
      display: block;
    }

    /* ========== 答题页：色带顶部 ========== */
    .question-page { animation: fadeIn 0.4s ease-out; margin: 0 -32px; }
    .q-shake { animation: qShake 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97); }
    @keyframes qShake {
      10%, 90% { transform: translateX(-2px); }
      20%, 80% { transform: translateX(4px); }
      30%, 50%, 70% { transform: translateX(-8px); }
      40%, 60% { transform: translateX(8px); }
    }
    .q-require-hint {
      text-align: center;
      margin: 0 32px;
      padding: 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      letter-spacing: 1.2px;
      color: var(--why);
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: opacity 0.25s ease, max-height 0.25s ease, padding 0.25s ease;
    }
    .q-require-hint.show {
      opacity: 1;
      max-height: 40px;
      padding: 12px 32px 4px;
    }
    .module-band {
      padding: 28px 32px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1.5px solid var(--ink);
    }
    .module-band.why { background: var(--why); }
    .module-band.how { background: var(--how); }
    .module-band.what { background: var(--what); color: var(--ink); }
    .module-band.constraint { background: var(--ink); }
    .band-letter {
      font-family: 'Noto Serif SC', serif;
      font-weight: 900;
      font-size: 32px;
      line-height: 1;
      letter-spacing: -0.5px;
    }
    .band-en {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 16px;
      opacity: 0.85;
      display: block;
      margin-top: 2px;
    }
    .band-counter {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      opacity: 0.9;
      text-align: right;
    }

    .q-content { padding: 48px 32px 0; }
    .progress-section {
      padding: 26px 32px 22px;
      border-bottom: 1px solid var(--line);
      margin: 0 -32px 0;
      background: var(--bg);
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 16px;
    }
    .progress-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      letter-spacing: 2px;
      color: var(--muted);
    }
    .progress-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.5px;
    }
    .progress-num {
      color: var(--ink);
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.5px;
      vertical-align: -2px;
      font-family: 'Cormorant Garamond', 'Times New Roman', serif;
    }
    .progress-total { color: var(--muted); margin-left: 2px; }
    .progress-bar {
      display: flex;
      height: 8px;
      gap: 2px;
      background: var(--bg-alt);
      border: 1px solid var(--line);
      padding: 1px;
      position: relative;
    }
    .progress-seg {
      flex: 1;
      background: var(--line);
      position: relative;
      transition: background 0.3s ease, transform 0.3s ease;
    }
    .progress-seg.why.done { background: var(--why); }
    .progress-seg.how.done { background: var(--how); }
    .progress-seg.what.done { background: var(--what); }
    .progress-seg.constraint.done { background: var(--ink); }
    .progress-seg.current {
      background: var(--ink);
      transform: scaleY(1.5);
      z-index: 2;
      box-shadow: 0 0 0 2px rgba(10,10,10,0.08);
    }
    .progress-modules {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 1px;
      color: var(--muted);
    }
    .progress-modules .pm-item { transition: color 0.25s, font-weight 0.25s; }
    .progress-modules .pm-item.active {
      color: var(--ink);
      font-weight: 600;
      position: relative;
    }
    .progress-modules .pm-item.active::before {
      content: '';
      display: inline-block;
      width: 5px;
      height: 5px;
      background: currentColor;
      margin-right: 6px;
      vertical-align: 1px;
      animation: pmPulse 1.6s ease-in-out infinite;
    }
    .progress-modules .pm-item.why.done { color: var(--why); }
    .progress-modules .pm-item.how.done { color: var(--how); }
    .progress-modules .pm-item.what.done { color: var(--what); }
    .progress-modules .pm-item.constraint.done { color: var(--ink); }
    @keyframes pmPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.4); }
    }

    .q-title {
      font-family: 'Noto Serif SC', serif;
      font-weight: 700;
      font-size: 28px;
      line-height: 1.4;
      margin: 0 0 20px;
      color: var(--ink);
      letter-spacing: -0.3px;
    }
    .q-hint {
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.7;
      margin: 0 0 32px;
      padding: 14px 18px;
      background: var(--bg-alt);
      border-left: 3px solid var(--ink);
    }
    .q-hint strong { color: var(--ink); }

    .options { display: flex; flex-direction: column; gap: 0; margin: 0 0 20px; }
    .option {
      background: #fff;
      border: 1.5px solid var(--line);
      border-bottom: none;
      padding: 16px 18px;
      text-align: left;
      font-size: 15px;
      color: var(--ink);
      cursor: pointer;
      font-family: inherit;
      line-height: 1.5;
      position: relative;
      padding-left: 50px;
      transition: all 0.15s;
    }
    .option:first-child { border-top: 1.5px solid var(--line); }
    .option:last-child { border-bottom: 1.5px solid var(--line); }
    .option::before {
      content: '';
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      border: 1.5px solid var(--ink);
      background: #fff;
    }
    .option:hover { background: var(--bg-alt); padding-left: 56px; }
    .option.selected {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
      padding-left: 56px;
    }
    .option.selected::before {

  function extractKeywords(text, dict, applyNegation = true) {
    if (!text || typeof text !== 'string') return [];
    const found = [];
    Object.entries(dict).forEach(([keyword, mapped]) => {
      let searchStart = 0;
      let counted = false;
      while (!counted) {
        const idx = text.indexOf(keyword, searchStart);
        if (idx === -1) break;
        if (!applyNegation || !hasNegationContext(text, idx)) {
          found.push(mapped);
          counted = true;
        }
        searchStart = idx + keyword.length;
      }
    });
    return found;
  }
  // ==================== 否定词过滤 ====================
  // 在关键词前 3 个字符内出现否定模式 → 视为否定语境，跳过该关键词
  // 设计取舍：只匹配"语法级否定"（不/没/无/别 + 情态词），不匹配情感动词
  // 因为"讨厌/恨/烦"后面的概念往往是用户反对的（反对虚伪=想要真诚），反向信号该被算入
  // 例："我不想自由" → "自由" 被跳过；"我讨厌虚伪" → "虚伪" 仍计入（→ 真诚）
  const NEGATION_RADIUS = 3;
  const NEGATION_PATTERNS = [
    '不想', '不愿', '不要', '不能', '不会', '不曾', '没法', '不会',
    '无法', '绝不', '从不', '不必',
    '不', '别', '没', '无', '非', '莫', '勿',
  ];
  function hasNegationContext(text, keywordIdx) {
    if (keywordIdx <= 0) return false;
    const start = Math.max(0, keywordIdx - NEGATION_RADIUS);
    const before = text.substring(start, keywordIdx);
    return NEGATION_PATTERNS.some(p => before.endsWith(p));
  }
  function countItems(arr) { return arr.reduce((m, item) => { m[item] = (m[item] || 0) + 1; return m; }, {}); }
  function topN(counter, n = 5) {
    return Object.entries(counter).filter(([k]) => k).sort((a, b) => b[1] - a[1]).slice(0, n).map(([k]) => k);
  }
  function extractValues(answers) {
    const all = [];
    // q2 是"愤怒什么"——用户写的负面词=反对的事，词典已映射到正面价值观，跳过否定过滤
    [answers.q1, answers.q4].forEach(t => { all.push(...extractKeywords(t, VALUE_KEYWORDS, true)); });
    if (answers.q2) all.push(...extractKeywords(answers.q2, VALUE_KEYWORDS, false));
    if (Array.isArray(answers.q3)) answers.q3.forEach(opt => { if (VALUE_KEYWORDS[opt]) all.push(VALUE_KEYWORDS[opt]); });
    if (Array.isArray(answers.q5)) answers.q5.forEach(opt => { if (VALUE_KEYWORDS[opt]) all.push(VALUE_KEYWORDS[opt]); });
    return topN(countItems(all), 5);
  }
  function extractTalents(answers) {
    const all = [];
    // q7 是"对别人烦躁"——反推法：别人做不到的事就是我擅长的，跳过否定过滤
    [answers.q6, answers.q8, answers.q9, answers.q10].forEach(t => { all.push(...extractKeywords(t, TALENT_KEYWORDS, true)); });
    if (answers.q7) all.push(...extractKeywords(answers.q7, TALENT_KEYWORDS, false));
    return topN(countItems(all), 5);
  }
  function extractInterests(answers) {
    const all = [];
    [answers.q11, answers.q12, answers.q13, answers.q14, answers.q15].forEach(t => { all.push(...extractKeywords(t, INTEREST_KEYWORDS, true)); });
    return topN(countItems(all), 5);
  }
  function analyze(answers) {
    const values = extractValues(answers);
    const talents = extractTalents(answers);
    const interests = extractInterests(answers);
    const topValue = values[0] || '热情';
    const topTalent = talents[0] || '写作';
    const topInterest = interests[0] || '自我认知';
    const vocation = composeVocation(topInterest, topTalent);
    const workPurpose = PURPOSE_TEMPLATES[topValue] || PURPOSE_TEMPLATES['热情'] || '让更多人活出自己';
    const trueVocation = `${vocation}，${workPurpose}`;
    const portrait = generatePortrait(answers, values, talents, interests, workPurpose, vocation);
    const actions = generateActions(answers, vocation, workPurpose, topInterest);
    const alternatives = generateAlternatives(interests, talents);
    return { values, talents, interests, topValue, topTalent, topInterest, vocation, workPurpose, trueVocation, portrait, actions, alternatives };
  }
  function composeVocation(interest, talent) {
    if (TALENT_TEMPLATES[talent]) return TALENT_TEMPLATES[talent](interest);
    return `用${talent}的方式做${interest}相关的事`;
  }
  function generateAlternatives(interests, talents) {
    const alternatives = [];
    const combos = [];
    if (interests[1] && talents[0]) combos.push([interests[1], talents[0]]);
    if (interests[0] && talents[1]) combos.push([interests[0], talents[1]]);
    if (interests[1] && talents[1]) combos.push([interests[1], talents[1]]);
    combos.slice(0, 2).forEach(([i, t]) => { try { alternatives.push({ interest: i, talent: t, text: composeVocation(i, t) }); } catch (e) {} });
    return alternatives;
  }
  function pickSnippet(text, fallback = '', max = 50) {
    if (!text) return fallback;
    const cleaned = String(text).replace(/\s+/g, ' ').trim();
    if (cleaned.length <= max) return cleaned;
    return cleaned.slice(0, max) + '…';
  }
  function generatePortrait(answers, values, talents, interests, purpose, vocation) {
    const lines = [];
    const admire = (answers.q1 || '').trim();
    const anger = (answers.q2 || '').trim();
    const saved = (answers.q4 || '').trim();
    const flowDetail = (answers.q6 || '').trim();
    const helping = (answers.q8 || '').trim();
    const praised = (answers.q10 || '').trim();
    const savedInterest = (answers.q13 || '').trim();
    if (values.length > 0) lines.push(`你身上最稳的信号是<em>${values.slice(0, 3).join('、')}</em>。`);
    if (admire) lines.push(`你提到尊敬的<em>${pickSnippet(admire, '那个人', 30)}</em>——这种尊敬通常反映你内心还没活出来的部分。`);
    if (talents.length > 0) {
      const flowSnippet = pickSnippet(flowDetail, '');
      lines.push(`你擅长的事（<em>${talents[0]}</em>相关）有具体证据：${flowSnippet ? `比如${flowSnippet}——` : ''}这些是你"无意识就能做到的事"。`);
    }
    if (helping || praised) {
      const parts = [];
      if (helping) parts.push(`别人找你帮的事是<em>${pickSnippet(helping, '', 25)}</em>`);
      if (praised) parts.push(`别人夸过你<em>${pickSnippet(praised, '', 25)}</em>`);
      lines.push(`外部验证：${parts.join('；')}。这些不是"应该擅长"的，而是你"已经在做得好"的。`);
    }
    if (interests.length > 0) {
      const savedIntSnippet = pickSnippet(savedInterest, '');
      lines.push(`你真正感兴趣的领域（<em>${interests[0]}</em>）不是"应该学的"，而是${savedIntSnippet ? `曾经${savedIntSnippet}拯救过你——` : ''}一种"不知为何很在意"的领域。`);
    }
    if (anger) lines.push(`你对<em>${pickSnippet(anger, '某些事', 30)}</em>感到不满——这种不满背后是你心中的理想状态，也是你"想做的事"的客户。`);
    lines.push(`把这三个支柱组合起来：你的<em>${vocation}</em>是做事的方式，背后的目的是<em>${purpose}</em>——这就是你的"真正想做的事"。`);
    return lines.join('\n\n');
  }
  function generateActions(answers, vocation, purpose, topInterest) {
    return [
      { time: '本周', title: `做一件"${vocation.slice(0, 14)}…"相关的最小事`,
        text: `哪怕 30 分钟。<em>让身体重新记住这件事的质感</em>——不需要赚钱、不需要给别人看。` },

  }

  // ==================== 答题页 ====================
  function renderOption(q, opt) {
    const isMulti = q.type === 'multi';
    const val = state.answers[q.id] || (isMulti ? [] : '');
    const selected = isMulti ? val.includes(opt) : val === opt;
    return `<button class="option ${selected ? 'selected' : ''}" data-opt="${escapeAttr(opt)}">${escapeHTML(opt)}</button>`;
  }
  function renderQuestionBody(q) {
    if (q.type === 'multi') {
      const sel = state.answers[q.id] || [];
      const limit = q.max || 5;
      return `
        ${q.hint ? `<div class="q-hint">${q.hint}</div>` : ''}
        <div class="options-count">最多 ${limit} 个 · 已选 ${sel.length}/${limit}</div>
        <div class="options">${q.options.map(o => renderOption(q, o)).join('')}</div>
        ${q.allowCustom ? `<input type="text" class="custom-input" id="customInput" placeholder="${escapeAttr(q.custom || '其他...')}" />` : ''}
      `;
    } else if (q.type === 'text') {
      const val = state.answers[q.id] || '';
      return `
        ${q.hint ? `<div class="q-hint">${q.hint}</div>` : ''}
        <textarea class="text-input" id="textInput" placeholder="${escapeAttr(q.placeholder || '')}">${escapeHTML(val)}</textarea>
      `;
    }
  }
  function renderDialogue() {
    const q = QUESTIONS[state.currentIdx];
    if (!q) return renderResult();
    const isLast = state.currentIdx === QUESTIONS.length - 1;
    return `
      ${renderHeader(`
        <div class="question-page">
          <div class="module-band ${q.module}">
            <div>
              <div class="band-letter">${q.module === 'values' ? '重' : q.module === 'talents' ? '擅' : q.module === 'interests' ? '喜' : '拼'}</div>
              <span class="band-en">${escapeHTML(q.moduleLabel)}</span>
            </div>
            <div class="band-counter">第 ${state.currentIdx + 1} 题 / 共 ${QUESTIONS.length} 题${q.optional ? ' · 可选' : ''}</div>
          </div>
          ${renderProgress()}
          <div class="q-content">
            <h2 class="q-title">${escapeHTML(q.title)}</h2>
            <div class="q-body">${renderQuestionBody(q)}</div>
          </div>
          <div id="qRequireHint" class="q-require-hint">${q.optional ? '这道题可选填，可以直接跳过' : '请先回答这道题，再进入下一题 ↑'}</div>
          <div class="q-footer">
            <button class="q-link" id="prevBtn">← 上一题</button>
            <div class="q-nav">
              ${q.optional ? '<button class="q-link" id="skipBtn">跳过</button>' : ''}
              <button class="q-link primary" id="nextBtn">${isLast ? '查看结果' : '下一题'} →</button>
            </div>
          </div>
        </div>
      `)}
    `;
  }

  // ==================== 列表模式 ====================
  function renderList() {
    const modules = {};
    QUESTIONS.forEach((q, i) => {
      if (!modules[q.module]) modules[q.module] = { label: q.moduleLabel, type: q.module, items: [] };
      modules[q.module].items.push({ q, i });
    });
    return renderHeader(`
      <div class="list-page">
        <div class="list-progress-block">${renderProgress()}</div>
        ${Object.values(modules).map(mod => `
          <section class="list-section">
            <div class="list-section-header ${mod.type}">
              <span class="list-section-letter">${mod.type === 'values' ? '重' : mod.type === 'talents' ? '擅' : mod.type === 'interests' ? '喜' : '拼'}</span>
              <h3 class="list-section-title">${escapeHTML(mod.label)}</h3>
              <span class="list-section-count">${mod.items.length} 题${mod.items[0].q.optional ? ' · 2 可选' : ''}</span>
            </div>
            ${mod.items.map(({ q, i }) => renderListQ(q, i)).join('')}
          </section>
        `).join('')}
        <div class="list-cta">
          <button class="btn-solid" id="generateBtn" ${answeredCount() < 8 ? 'disabled' : ''}>
            ${answeredCount() < 8 ? `至少答 8 题（当前 ${answeredCount()} 题）` : '查看我的结论'} <span class="arrow">→</span>
          </button>
        </div>
      </div>
    `);
  }
  function renderListQ(q, i) {
    const done = answeredQ(q.id);
    return `
      <div class="list-q" data-qid="${q.id}">
        <h4 class="list-q-title">
          <span class="list-q-num">${String(i+1).padStart(2,'0')}.</span>
          <span>${escapeHTML(q.title)}</span>
          ${done ? '<span class="list-q-done">✓ 已答</span>' : ''}
        </h4>
        ${renderQuestionBody(q)}
      </div>
    `;
  }

  // ==================== 结果页 ====================
  function renderResult() {
    const r = analyze(state.answers);
    const constraints = state.answers.q16 || [];
    return renderHeader(`
      <div class="result-page">
        <div class="result-header">
          <div class="result-eyebrow">结论</div>
          <h1 class="result-title">致迷茫后的你</h1>
          <p class="result-lede">这不是"你人生的唯一答案"，<br/>而是一个"基于你现有回答的方向"——<br/>你随时可以修改它。</p>
        </div>

        <section class="verdict">
          <div class="verdict-tag">你的方向</div>
          <p class="verdict-text">
            <span class="verdict-quote">"</span>${escapeHTML(r.vocation)}<span class="accent">，</span>${escapeHTML(r.workPurpose)}<span class="verdict-quote">"</span>
          </p>
        </section>

        <section class="elements">
          <article class="element why">
            <div class="element-stripe"></div>
            <div class="element-inner">
              <div class="element-meta">
                <span class="element-num">01</span>
                <span class="element-label">重要的事</span>
              </div>
              <div class="element-title">工作目的</div>
              <div class="element-text">${escapeHTML(r.workPurpose)}</div>
              <div class="element-tags">
                ${r.values.length > 0 ? `<span class="element-tag primary">${escapeHTML(r.topValue)}</span>` : ''}
                ${r.values.slice(1, 4).map(v => `<span class="element-tag">${escapeHTML(v)}</span>`).join('')}
              </div>
            </div>
          </article>

          <article class="element how">
            <div class="element-stripe"></div>
            <div class="element-inner">
              <div class="element-meta">
                <span class="element-num">02</span>
                <span class="element-label">擅长的事</span>
              </div>
              <div class="element-title">做事方式</div>
              <div class="element-text">${escapeHTML(r.vocation)}</div>
              <div class="element-tags">
                ${r.talents.length > 0 ? `<span class="element-tag primary">${escapeHTML(r.topTalent)}</span>` : ''}
                ${r.talents.slice(1, 4).map(v => `<span class="element-tag">${escapeHTML(v)}</span>`).join('')}
              </div>
            </div>
          </article>

          <article class="element what">
            <div class="element-stripe"></div>
            <div class="element-inner">
              <div class="element-meta">
                <span class="element-num">03</span>
                <span class="element-label">喜欢的事</span>
              </div>
              <div class="element-title">感兴趣的领域</div>
              <div class="element-text">${escapeHTML(r.topInterest)}</div>
              <div class="element-tags">
                ${r.interests.length > 0 ? `<span class="element-tag primary">${escapeHTML(r.topInterest)}</span>` : ''}
                ${r.interests.slice(1, 4).map(v => `<span class="element-tag">${escapeHTML(v)}</span>`).join('')}
              </div>
            </div>
          </article>
        </section>

        ${r.alternatives.length > 0 ? `
          <section class="alts">
            <h3 class="alts-title"><span class="num">04</span> 其他可能性</h3>
            ${r.alternatives.map((a, i) => `
              <div class="alt-item">"${escapeHTML(a.text)}"</div>
            `).join('')}
          </section>
        ` : ''}

        <section class="portrait">
          <h3 class="portrait-title"><span class="num">05</span> 个人画像</h3>
          <div class="portrait-text">${r.portrait}</div>
        </section>

        ${constraints.length > 0 ? `
          <div class="constraint">
            <strong>你的现实约束：</strong>${constraints.map(c => escapeHTML(c)).join('、')}<br/>
            ——不限制方向，但会记在后续行动里。
          </div>
        ` : ''}

        <section class="actions">
          <h3 class="actions-title"><span class="num">06</span> 3 条可执行行动</h3>
          ${r.actions.map(a => `
            <div class="action-item">
              <div class="action-time">${escapeHTML(a.time)}</div>
              <div class="action-content">
                <strong>${escapeHTML(a.title)}</strong>
                <span>${a.text}</span>
              </div>
            </div>
          `).join('')}
        </section>

        <p class="closing">
          "想做的事"不是结论，是路标。<br/>走几次，才会慢慢看见。
        </p>

        <div class="result-footer">
          <button class="btn-link" id="backToListBtn">← 回看问题</button>
          <button class="btn-link" id="restartBtn">重新开始</button>
          <button class="btn-solid" id="exportBtn">复制文字版 <span class="arrow">→</span></button>
        </div>

        <div class="signature">
          <div class="signature-text">Find Your Calling</div>
          <div class="signature-text"><span class="accent">●</span> 八木仁平方法</div>
        </div>
      </div>
    `);
  }

  // ==================== 事件 ====================
  function attachEvents() {
    document.getElementById('brandHome')?.addEventListener('click', () => { state.view = 'welcome'; render(); });
    document.getElementById('modeToggle')?.addEventListener('click', e => {
      if (e.target.dataset.mode) { state.mode = e.target.dataset.mode; state.view = state.mode; render(); }
    });
    document.getElementById('startBtn')?.addEventListener('click', () => { state.view = 'misconceptions'; render(); });
    document.getElementById('resumeBtn')?.addEventListener('click', () => {
      const firstUnanswered = QUESTIONS.findIndex(q => !q.optional && !answeredQ(q.id));
      state.currentIdx = firstUnanswered >= 0 ? firstUnanswered : 0;
      state.view = 'dialogue'; state.mode = 'dialogue'; render();
    });
    document.getElementById('understoodBtn')?.addEventListener('click', () => {
      const firstUnanswered = QUESTIONS.findIndex(q => !q.optional && !answeredQ(q.id));
      state.currentIdx = firstUnanswered >= 0 ? firstUnanswered : 0;
      state.view = 'dialogue'; state.mode = 'dialogue'; render();
    });
    const q = QUESTIONS[state.currentIdx];
    if (state.view === 'dialogue' && q) {
      attachQuestionEvents(q);
      document.getElementById('prevBtn')?.addEventListener('click', () => { if (state.currentIdx > 0) { state.currentIdx--; render(); } });
      document.getElementById('nextBtn')?.addEventListener('click', () => {
        const cq = QUESTIONS[state.currentIdx];
        if (!cq.optional && !answeredQ(cq.id)) {
          const card = document.querySelector('.question-page');
          if (card) {
            card.classList.add('q-shake');
            const hint = document.getElementById('qRequireHint');
            if (hint) hint.classList.add('show');
            setTimeout(() => card.classList.remove('q-shake'), 420);
          }
          return;
        }
        if (state.currentIdx < QUESTIONS.length - 1) state.currentIdx++;
        else state.view = 'result';
        render();
      });
      document.getElementById('skipBtn')?.addEventListener('click', () => {
        if (state.currentIdx < QUESTIONS.length - 1) state.currentIdx++;
        else state.view = 'result';
        render();
      });
    }
    if (state.view === 'list') {
      QUESTIONS.forEach(qq => attachQuestionEvents(qq));
      document.getElementById('generateBtn')?.addEventListener('click', () => {
        if (answeredCount() >= 8) { state.view = 'result'; render(); }
      });
    }
    document.getElementById('restartBtn')?.addEventListener('click', () => {
      if (confirm('确定要清空所有答案重新开始吗？')) {
        state.answers = {}; state.currentIdx = 0; state.view = 'welcome'; state.mode = 'dialogue';
        localStorage.removeItem(STORAGE_KEY); render();
      }
    });
    document.getElementById('backToListBtn')?.addEventListener('click', () => { state.view = 'list'; state.mode = 'list'; render(); });
    document.getElementById('exportBtn')?.addEventListener('click', () => {
      const text = generateExportText();
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('exportBtn');
        const orig = btn.innerHTML;
        btn.innerHTML = '已复制 ✓';
        setTimeout(() => { btn.innerHTML = orig; }, 1800);
      }).catch(() => { alert('复制失败，请手动复制'); });
    });
  }

  function attachQuestionEvents(q) {
    const containers = [];
    const stage = document.querySelector(`[data-qid="${q.id}"]`) || document.querySelector('.question-page');
    if (stage) containers.push(stage);
    if (containers.length === 0) return;
    containers.forEach(container => {
      if (q.type === 'multi') {
        container.querySelectorAll('.option').forEach(btn => {
          btn.addEventListener('click', () => {
            const opt = btn.dataset.opt;
            const arr = state.answers[q.id] || [];
            const idx = arr.indexOf(opt);
            if (idx >= 0) arr.splice(idx, 1);
            else { if (arr.length >= (q.max || 5)) arr.shift(); arr.push(opt); }
            state.answers[q.id] = [...arr];
            render();
          });
        });
      } else if (q.type === 'text') {
        const input = container.querySelector('#textInput');
        if (input) {
          input.addEventListener('input', e => { state.answers[q.id] = e.target.value; saveState(); });
        }
      }
      const customInput = container.querySelector('#customInput');
      if (customInput) {
        customInput.addEventListener('keydown', e => {
          if (e.key === 'Enter' && customInput.value.trim()) {
            const val = customInput.value.trim();
            const arr = state.answers[q.id] || [];
            if (!arr.includes(val) && arr.length < (q.max || 5)) {
              arr.push(val); state.answers[q.id] = [...arr]; customInput.value = ''; render();
            }
          }
        });
      }
    });
  }

  function generateExportText() {
    const r = analyze(state.answers);
    let text = `【找到想做的事 · Find Your Calling】\n\n`;
    text += `—— 核心结论 ——\n"${r.vocation}，${r.workPurpose}"\n\n`;
    text += `—— 三大支柱 ——\n`;
    text += `Why（重要的事）: ${r.workPurpose}\n   价值观关键词: ${r.values.join('、') || '未识别'}\n`;
    text += `How（擅长的事）: ${r.vocation}\n   才能关键词: ${r.talents.join('、') || '未识别'}\n`;
    text += `What（喜欢的事）: ${r.topInterest}\n   领域关键词: ${r.interests.join('、') || '未识别'}\n\n`;
    if (r.alternatives.length > 0) {
      text += `—— 备选方案 ——\n`;
      r.alternatives.forEach((a, i) => text += `${i+1}. "${a.text}"\n`);
      text += '\n';
    }
    text += `—— 个人画像 ——\n${r.portrait.replace(/<[^>]+>/g, '')}\n\n`;
    text += `—— 3 条行动 ——\n`;
    r.actions.forEach(a => { text += `\n[${a.time}] ${a.title}\n${a.text.replace(/<[^>]+>/g, '')}\n`; });
    text += `\n—— 完整答案 ——\n`;
    QUESTIONS.forEach((q, i) => {
      const v = state.answers[q.id];
      if (!v || (Array.isArray(v) && v.length === 0) || (typeof v === 'string' && !v.trim())) return;
      text += `\n${i+1}. [${q.moduleLabel}] ${q.title}\n`;
      if (Array.isArray(v)) text += v.join(' / ') + '\n';
      else text += v + '\n';
    });
    return text;
  }

  function escapeHTML(s) {
    if (!s) return '';
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function escapeAttr(s) { return escapeHTML(s); }

  loadState();
  render();
  </script>
</body>
</html>
